services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/data/blog.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_NAME: ${APP_NAME:-TerminalExplore}
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-8090}}
    volumes:
      - blog-data:/app/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  blog-data:
